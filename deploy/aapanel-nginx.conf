# KARTEKS Energy Solution — AAPanel Nginx Configuration
#
# TARGET: AAPanel (https://www.aapanel.com/) running on a home server
#         accessed via Cloudflare Tunnel (no public IP exposure).
#
# AAPanel stores site configs in: /www/server/panel/vhost/nginx/
# This file replaces or supplements the default Laravel site config.
#
# Cloudflare Tunnel specifics:
# - Tunnel routes public hostname → http://localhost:<port> on origin server
# - AAPanel listens on internal port (typically 80/443 for PHP-FPM proxy)
# - All real client IPs come from CF-Connecting-IP header (handled by app middleware)
# - CF sets X-Forwarded-Proto to https automatically
# - We do NOT terminate TLS at Nginx (Cloudflare handles it) — but AAPanel
#   may also have its own self-signed SSL. Either way works.
#
# Place: /www/server/panel/vhost/nginx/karteks-energy-solution.conf
# Or:   /etc/nginx/conf.d/karteks-energy-solution.conf (if not using AAPanel)
#
# Test: sudo nginx -t
# Reload (AAPanel): aaPanel → Website → karteks-energy-solution → Reload

# HTTP server (AAPanel default port 80, Cloudflare Tunnel terminates TLS upstream)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # AAPanel default web root for site
    root /www/wwwroot/karteks-energy-solution/public;

    access_log /www/wwwlogs/karteks-access.log;
    error_log  /www/wwwlogs/karteks-error.log;

    index index.php index.html;

    # Max upload size (matches ValidateFileUpload middleware — 10MB)
    client_max_body_size 12M;       # 10M content + 2M multipart envelope
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Hide Nginx version (security)
    server_tokens off;

    # Laravel: send all non-static requests to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM (AAPanel uses php-fpm-{version} service name)
    # Check actual version with: ls /www/server/php/
    location ~ \.php$ {
        # Adjust to actual PHP version installed via AAPanel
        fastcgi_pass unix:/tmp/php-cgi-82.sock;       # PHP 8.2
        # fastcgi_pass unix:/tmp/php-cgi-83.sock;     # PHP 8.3 (uncomment if applicable)
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeouts (cloudflare free tier has 100s, paid 600s)
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;

        # Disable buffering for streaming responses (PDF, large JSON)
        fastcgi_buffering off;
        fastcgi_request_buffering off;

        # Buffer size for headers
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Static asset caching — 1 year, immutable (vendor/build/storage files)
    location ~* \.(css|js|woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status "LONG-TERM";
        access_log off;
    }

    # Image asset caching — 30 days (allow for image regeneration)
    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Media library (Spatie) at /storage/* — long cache but NOT immutable
    # (regenerated files get same path)
    location /storage/ {
        alias /www/wwwroot/karteks-energy-solution/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;

        # Block PHP execution in storage (defense in depth)
        location ~ \.php$ { deny all; }
    }

    # Block sensitive paths
    location ~ /\.(?!well-known) { deny all; }
    location ~ /\.env           { deny all; }
    location ~ /\.git           { deny all; }
    location ~ /composer\.(json|lock) { deny all; }
    location ~ /package(-lock)?\.json { deny all; }
    location ~ /yarn\.lock      { deny all; }

    # Hide X-Powered-By
    fastcgi_hide_header X-Powered-By;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;
}

# Health check endpoint for Cloudflare Tunnel upstream monitoring
server {
    listen 127.0.0.1:9090;
    server_name _;
    access_log off;
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}

# Cloudflare real IP module — must be loaded once
# AAPanel usually has it pre-installed. If not:
# sudo apt install libnginx-mod-http-cloudflare-realip (Debian/Ubuntu)
# Then in main nginx.conf: include /etc/nginx/cloudflare_realip.conf;

