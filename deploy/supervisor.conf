[program:karteks-worker]
process_name=%(program_name)s_%(process_num)02d
; Adjust path to your project directory
command=php /var/www/karteks-energy-solution/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/karteks-worker.log
stopwaitsecs=3600
; For Redis queue:
; command=php /var/www/karteks-energy-solution/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --queue=default,notifications,emails

[program:karteks-scheduler]
process_name=%(program_name)s
; Runs the Laravel scheduler every minute via cron
; Add this to crontab: * * * * * cd /var/www/karteks-energy-solution && php artisan schedule:run >> /dev/null 2>&1
command=php /var/www/karteks-energy-solution/artisan schedule:run
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/karteks-scheduler.log
