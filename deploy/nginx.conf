# KARTEKS Energy Solution — Production Nginx Configuration
# Place in /etc/nginx/sites-available/karteks-energy-solution
# Then symlink: sudo ln -s /etc/nginx/sites-available/karteks-energy-solution /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name karteksenergy.com www.karteksenergy.com;

    return 301 https://$server_name$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name karteksenergy.com www.karteksenergy.com;

    # SSL certificates (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/karteksenergy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karteksenergy.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Document root
    root /var/www/karteks-energy-solution/public;

    # Security headers (also enforced by app middleware)
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;

    # Logs
    access_log /var/log/nginx/karteks-access.log;
    error_log  /var/log/nginx/karteks-error.log;

    index index.php index.html;

    # Max upload size (matches app/Http/Middleware/ValidateFileUpload.php)
    client_max_body_size 10M;

    # Main routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel (PHP-FPM)
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeouts
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
        fastcgi_buffering off;
    }

    # Deny access to sensitive files
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    location ~ /\.git {
        deny all;
    }

    # Static assets — aggressive caching
    location ~* \.(css|js|woff2?|ttf|eot|svg|jpg|jpeg|png|webp|ico|avif|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Block .php files in storage (uploaded files)
    location ~ /storage/.*\.php$ {
        deny all;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/xml+rss;
}
